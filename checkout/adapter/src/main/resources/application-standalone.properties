# Standalone profile — boots checkout with no external infrastructure (in-memory session store).
# app name normally comes from bootstrap.yml — bootstrap reads bootstrap-standalone.yml on this profile
spring.application.name=checkout-service
server.port=8084

# Sibling services on their standalone ports
checkout.clients.catalog-url=http://localhost:8080
checkout.clients.inventory-url=http://localhost:8081
checkout.clients.order-url=http://localhost:8082
checkout.clients.payment-url=http://localhost:8083
