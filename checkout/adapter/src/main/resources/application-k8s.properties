# k8s profile — stateless saga orchestrator. No DB; sibling services reached over REST by their
# in-cluster Service DNS (all on port 8080). Session store is in-memory (single replica).
spring.application.name=checkout-service
server.port=8080
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

checkout.clients.catalog-url=http://${CATALOG_HOST:catalog.marketplace}:8080
checkout.clients.inventory-url=http://${INVENTORY_HOST:inventory.marketplace}:8080
checkout.clients.order-url=http://${ORDER_HOST:order.marketplace}:8080
checkout.clients.payment-url=http://${PAYMENT_HOST:payment.marketplace}:8080
