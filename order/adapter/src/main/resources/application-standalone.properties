# Standalone profile — boots order with no external infrastructure (H2 only).
# Spring Cloud Config is disabled via run args (see OrderStandaloneApplication javadoc):
#   --spring.cloud.config.enabled=false --spring.config.import=

spring.datasource.url=jdbc:h2:mem:orderdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
server.port=8082
