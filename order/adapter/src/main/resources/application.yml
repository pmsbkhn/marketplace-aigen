# Local defaults — the config server (bootstrap.yml) overrides these per environment.
spring:
  kafka:
    consumer:
      group-id: order-worker   # tech spec: consumer group "order-worker"

# Event routing: (source, type) -> topic + format, used by BOTH sides — the outbox sender routes
# published events (OrderCompleted/OrderCancelled) and the @KafkaListener derives its subscription.
# Note: the listener subscribes every routed topic, including order-events; records this service
# published there have no registered pipeline and are skipped with a warning.
app:
  config:
    event:
      routing:
        events:
          - source: Payment
            type: PaymentReceived
            topic: payment-events
            format: JSON
          - source: Payment
            type: PaymentFailed
            topic: payment-events
            format: JSON
          - source: Order
            type: OrderCompleted
            topic: order-events
            format: JSON
          - source: Order
            type: OrderCancelled
            topic: order-events
            format: JSON
