# Standalone profile — boots payment with no external infrastructure (H2 only).
# Spring Cloud Config is disabled via run args (see PaymentStandaloneApplication javadoc):
#   --spring.cloud.config.enabled=false --spring.config.import=

# app name normally comes from bootstrap.yml — bootstrap is disabled on this profile
spring.application.name=payment-service
spring.datasource.url=jdbc:h2:mem:paymentdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
server.port=8083
