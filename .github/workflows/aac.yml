name: AaC (Structurizr) validate

# Chống "trôi tài liệu": mỗi thay đổi trong docs/aac phải parse được và render được.
# - `validate` bắt lỗi cú pháp DSL + identifier gãy + !include/!docs/!adrs hỏng.
# - `export` ép Structurizr dựng từng view -> bắt lỗi view key/embed/quan hệ không tồn tại.
# Chạy có giới hạn theo path để không tốn CI cho thay đổi không liên quan.

on:
  push:
    branches: [main]
    paths:
      - 'docs/aac/**'
      - '.github/workflows/aac.yml'
  pull_request:
    paths:
      - 'docs/aac/**'
      - '.github/workflows/aac.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # PHẢI ghim tag ngày cụ thể. KHÔNG dùng :latest — image :latest đã bị thay bằng
      # stub chỉ in banner deprecation rồi exit 0 (entrypoint không còn chạy CLI), nên
      # validate/export trở thành no-op âm thầm: PR xanh nhưng không kiểm tra gì.
      # 2025.11.09 là tag ngày cuối cùng còn chạy CLI thật (xác nhận trên Docker Hub).
      - name: Validate Structurizr DSL workspace
        run: |
          docker run --rm -v "$PWD:/work" -w /work structurizr/cli:2025.11.09 \
            validate -workspace docs/aac/workspace.dsl

      - name: Export all views (Mermaid) — phát hiện lỗi view/embed
        run: |
          mkdir -p build/aac
          docker run --rm -v "$PWD:/work" -w /work structurizr/cli:2025.11.09 \
            export -workspace docs/aac/workspace.dsl -format mermaid -output build/aac

      - name: Upload exported diagrams
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: aac-diagrams
          path: build/aac
