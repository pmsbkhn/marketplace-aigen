name: Build, test & fitness

# Full per-service CI: compiles and runs the entire test suite (mvn test) for each service, AND
# collects the architecture fitness verdicts (FitnessResult NDJSON, the EA scorecard contract) that
# the same run emits via -Dea.fitness.sink=stdout. Fails if ANY service's build/tests fail or if any
# enforced architecture violation is present. Uploads the verdict stream as an artifact.
#
# Prerequisite: a repo secret GH_PACKAGES_PAT (a PAT with scope read:packages) so CI can resolve
# msfw + ea-archrules from GitHub Packages — GITHUB_TOKEN cannot read cross-repo packages.
# Note: the full suite includes Testcontainers-based tests; the ubuntu-latest runner provides Docker.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build, test & collect fitness verdicts
        env:
          GH_PACKAGES_USER: ${{ github.repository_owner }}
          GH_PACKAGES_PAT: ${{ secrets.GH_PACKAGES_PAT }}
        run: |
          : > fitness-results.ndjson
          failed=""
          for svc in catalog order payment inventory notification checkout; do
            echo "::group::$svc"
            if ( cd "$svc" && mvn -B -ntp -s ../.github/ci-settings.xml test \
                   -Dea.fitness.sink=stdout ) | tee "/tmp/$svc.log"; then
              echo "$svc: build + tests OK"
            else
              echo "::warning::$svc build/tests failed"
              failed="$failed $svc"
            fi
            grep 'EA_FITNESS_RESULT' "/tmp/$svc.log" | sed 's/^.*EA_FITNESS_RESULT //' \
              >> fitness-results.ndjson || true
            echo "::endgroup::"
          done
          echo "Collected $(wc -l < fitness-results.ndjson) verdict(s)"
          echo "FAILED_SERVICES=$failed" >> "$GITHUB_ENV"

      - name: Summarise conformance
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, collections
          rows = [json.loads(l) for l in open('fitness-results.ndjson') if l.strip()]
          by = collections.defaultdict(collections.Counter)
          for r in rows:
              by[r['system']][r['verdict']] += 1
          print("## Architecture conformance\n")
          print("| system | pass | warn | fail | waived | n/a |")
          print("|---|---:|---:|---:|---:|---:|")
          tot = collections.Counter()
          for s in sorted(by):
              c = by[s]; tot.update(c)
              print(f"| `{s}` | {c['pass']} | {c['warn']} | {c['fail']} | {c['waived']} | {c['skipped']} |")
          n = sum(tot.values()) or 1
          print(f"| **cohort** | **{tot['pass']}** | {tot['warn']} | {tot['fail']} | {tot['waived']} | {tot['skipped']} |")
          print(f"\n**{round(100*tot['pass']/n)}%** of {n} evaluations clean · **{tot['fail']}** enforced violation(s).")
          PY

      - name: Upload verdict stream
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: fitness-results
          path: fitness-results.ndjson

      - name: Gate on test failures & enforced violations
        run: |
          if [ -n "$(echo "$FAILED_SERVICES" | tr -d ' ')" ]; then
            echo "::error::build/tests failed for:$FAILED_SERVICES"
            exit 1
          fi
          if grep -q '"verdict":"fail"' fitness-results.ndjson; then
            echo "::error::enforced architecture violation(s) — see the conformance summary"
            exit 1
          fi
          echo "All services built, tested, and conformant."
