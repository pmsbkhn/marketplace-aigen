# k8s profile — runs in-cluster against the real PostgreSQL in the `infra` namespace.
# JSON transactional outbox is persisted to Postgres (Kafka publishing arrives in Phase C).
spring.application.name=catalog-service

spring.datasource.url=jdbc:postgresql://${DB_HOST:postgres.infra}:5432/${DB_NAME:catalog_db}
spring.datasource.username=${DB_USER:marketplace}
spring.datasource.password=${DB_PASSWORD:marketplace}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

server.port=8080
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
