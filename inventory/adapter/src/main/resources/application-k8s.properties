# k8s profile — runs in-cluster against the real PostgreSQL in the `infra` namespace.
spring.application.name=inventory-service

spring.datasource.url=jdbc:postgresql://${DB_HOST:postgres.infra}:5432/${DB_NAME:inventory_db}
spring.datasource.username=${DB_USER:marketplace}
spring.datasource.password=${DB_PASSWORD:marketplace}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

server.port=8080
management.endpoints.web.exposure.include=health,info,prometheus
# Every metric carries the service name - the msfw Grafana dashboard's selector keys off it.
management.metrics.tags.application=${spring.application.name}
management.endpoint.health.probes.enabled=true

# CloudEvent envelope constants the config server supplies in demo/prod; k8s has none.
app.config.event.cloudevent.specversion=1.0
app.config.event.cloudevent.contenttype.avro=application/avro
