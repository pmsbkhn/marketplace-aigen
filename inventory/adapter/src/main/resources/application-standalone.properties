# Standalone profile — boots inventory with no external infrastructure (H2 only).
spring.application.name=inventory-service
# Spring Cloud Config is disabled via run args (see InventoryStandaloneApplication javadoc):
#   --spring.cloud.config.enabled=false --spring.config.import=

spring.datasource.url=jdbc:h2:mem:inventorydb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
server.port=8081
