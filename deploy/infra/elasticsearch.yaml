# Elasticsearch — single-node read model for Catalog search (Phase C wires it in).
# Multi-arch image; security disabled for local; bootstrap relaxed for single-node.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: elasticsearch
  labels: { app: elasticsearch }
spec:
  replicas: 1
  selector:
    matchLabels: { app: elasticsearch }
  template:
    metadata:
      labels: { app: elasticsearch }
    spec:
      initContainers:
        # Elasticsearch needs vm.max_map_count >= 262144.
        - name: sysctl
          image: busybox:1.36
          command: ["sh", "-c", "sysctl -w vm.max_map_count=262144"]
          securityContext:
            privileged: true
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
          env:
            - name: discovery.type
              value: single-node
            - name: xpack.security.enabled
              value: "false"
            - name: ES_JAVA_OPTS
              value: "-Xms1g -Xmx1g"
          ports:
            - containerPort: 9200
          resources:
            requests: { cpu: 250m, memory: 1536Mi }
            limits:   { cpu: "2",  memory: 2Gi }
          readinessProbe:
            httpGet:
              path: /_cluster/health?wait_for_status=yellow&timeout=5s
              port: 9200
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  labels: { app: elasticsearch }
spec:
  selector: { app: elasticsearch }
  ports:
    - port: 9200
      targetPort: 9200
