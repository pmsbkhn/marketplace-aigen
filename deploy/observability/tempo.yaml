# Tempo — trace backend for saga drill-by-correlation (OTLP in, queried by Grafana).
# Monolithic, local storage, emptyDir — local-cluster sized. Lives in `infra` alongside
# Prometheus/Grafana. Services emit OTLP to tempo.infra:4318 (HTTP) / :4317 (gRPC); Grafana queries
# the API on :3200. Traces only appear once the services are instrumented to export OTLP (a separate
# service-side change — see deploy/observability/README or the PR notes).
apiVersion: v1
kind: ConfigMap
metadata:
  name: tempo-config
  namespace: infra
  labels: { app: tempo }
data:
  tempo.yaml: |
    server:
      http_listen_port: 3200
    distributor:
      receivers:
        otlp:
          protocols:
            http:
            grpc:
    ingester:
      max_block_duration: 5m
    storage:
      trace:
        backend: local
        local:
          path: /var/tempo/blocks
        wal:
          path: /var/tempo/wal
    compactor:
      compaction:
        block_retention: 24h
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tempo
  namespace: infra
  labels: { app: tempo }
spec:
  replicas: 1
  selector:
    matchLabels: { app: tempo }
  template:
    metadata:
      labels: { app: tempo }
    spec:
      containers:
        - name: tempo
          image: grafana/tempo:2.6.1
          args: ["-config.file=/etc/tempo/tempo.yaml"]
          ports:
            - { containerPort: 3200, name: http }
            - { containerPort: 4317, name: otlp-grpc }
            - { containerPort: 4318, name: otlp-http }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 512Mi }
          readinessProbe:
            httpGet: { path: /ready, port: 3200 }
            periodSeconds: 5
            initialDelaySeconds: 10
          volumeMounts:
            - { name: config, mountPath: /etc/tempo }
            - { name: data,   mountPath: /var/tempo }
      volumes:
        - name: config
          configMap: { name: tempo-config }
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: tempo
  namespace: infra
  labels: { app: tempo }
spec:
  selector: { app: tempo }
  ports:
    - { name: http,      port: 3200, targetPort: 3200 }
    - { name: otlp-grpc, port: 4317, targetPort: 4317 }
    - { name: otlp-http, port: 4318, targetPort: 4318 }
