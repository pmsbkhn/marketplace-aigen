# Grafana — provisioned with the Prometheus datasource and the msfw overview dashboard
# (copied from msfw ops/observability/grafana/msfw-overview.json — keep in sync when bumping
# msfw). Anonymous admin: local cluster only.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: infra
  labels: { app: grafana }
data:
  datasources.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.infra:9090
        isDefault: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: infra
  labels: { app: grafana }
data:
  provider.yml: |
    apiVersion: 1
    providers:
      - name: msfw
        folder: msfw
        type: file
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: infra
  labels: { app: grafana }
data:
  msfw-overview.json: |
    {
      "title": "MSFW Overview",
      "uid": "msfw-overview",
      "tags": [
        "msfw"
      ],
      "schemaVersion": 39,
      "editable": true,
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "refresh": "30s",
      "templating": {
        "list": [
          {
            "name": "application",
            "label": "Service",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "query": "label_values(msfw_outbox_stored_events, application)",
            "includeAll": true,
            "multi": true,
            "refresh": 2
          }
        ]
      },
      "panels": [
        {
          "type": "row",
          "title": "Outbox (producer)",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          }
        },
        {
          "type": "stat",
          "title": "Pending (publication lag)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 0,
            "y": 1
          },
          "targets": [
            {
              "expr": "sum(msfw_outbox_pending_events{application=~\"$application\"})",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 100
                  },
                  {
                    "color": "red",
                    "value": 1000
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "type": "stat",
          "title": "Parked (poison)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 4,
            "y": 1
          },
          "targets": [
            {
              "expr": "sum(msfw_outbox_parked_events{application=~\"$application\"})",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "type": "stat",
          "title": "Scheduled (delayed)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 8,
            "y": 1
          },
          "targets": [
            {
              "expr": "sum(msfw_outbox_scheduled_events{application=~\"$application\"})",
              "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Outbox pending by service",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 5,
            "w": 12,
            "x": 12,
            "y": 1
          },
          "targets": [
            {
              "expr": "msfw_outbox_pending_events{application=~\"$application\"}",
              "legendFormat": "{{application}}",
              "refId": "A"
            }
          ]
        },
        {
          "type": "row",
          "title": "Consumption (consumer)",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 6
          }
        },
        {
          "type": "timeseries",
          "title": "Records/s by outcome",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 7,
            "w": 8,
            "x": 0,
            "y": 7
          },
          "targets": [
            {
              "expr": "sum by (outcome) (rate(msfw_consumption_duration_seconds_count{application=~\"$application\"}[5m]))",
              "legendFormat": "{{outcome}}",
              "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Processing time max by topic (s)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 7,
            "w": 8,
            "x": 8,
            "y": 7
          },
          "targets": [
            {
              "expr": "max by (topic) (msfw_consumption_duration_seconds_max{application=~\"$application\"})",
              "legendFormat": "{{topic}}",
              "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Kafka consumer lag (max partition)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 7,
            "w": 8,
            "x": 16,
            "y": 7
          },
          "targets": [
            {
              "expr": "max by (application) (kafka_consumer_fetch_manager_records_lag_max{application=~\"$application\"})",
              "legendFormat": "{{application}}",
              "refId": "A"
            }
          ]
        },
        {
          "type": "row",
          "title": "Distributed-locked tasks",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 14
          }
        },
        {
          "type": "timeseries",
          "title": "Task runs/s by task + outcome",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 0,
            "y": 15
          },
          "targets": [
            {
              "expr": "sum by (task, outcome) (rate(msfw_locking_task_runs_total{application=~\"$application\"}[5m]))",
              "legendFormat": "{{task}} {{outcome}}",
              "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Task duration max (s)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 12,
            "y": 15
          },
          "targets": [
            {
              "expr": "max by (task) (msfw_locking_task_duration_seconds_max{application=~\"$application\"})",
              "legendFormat": "{{task}}",
              "refId": "A"
            }
          ]
        },
        {
          "type": "row",
          "title": "Saga & compensating workflow",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 22
          }
        },
        {
          "type": "timeseries",
          "title": "Saga events/s by outcome",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 7,
            "w": 8,
            "x": 0,
            "y": 23
          },
          "targets": [
            {
              "expr": "sum by (saga, outcome) (rate(msfw_saga_events_total{application=~\"$application\"}[5m]))",
              "legendFormat": "{{saga}} {{outcome}}",
              "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Saga deadlines fired/s",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 7,
            "w": 8,
            "x": 8,
            "y": 23
          },
          "targets": [
            {
              "expr": "sum by (saga) (rate(msfw_saga_expired_total{application=~\"$application\"}[5m]))",
              "legendFormat": "{{saga}}",
              "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Workflow runs/s by outcome",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 7,
            "w": 8,
            "x": 16,
            "y": 23
          },
          "targets": [
            {
              "expr": "sum by (workflow, outcome) (rate(msfw_workflow_runs_total{application=~\"$application\"}[5m]))",
              "legendFormat": "{{workflow}} {{outcome}}",
              "refId": "A"
            }
          ]
        }
      ]
    }
  ea-conformance.json: |
    {
      "title": "EA Architecture Conformance",
      "uid": "ea-conformance",
      "tags": ["ea", "governance"],
      "schemaVersion": 39,
      "editable": true,
      "time": { "from": "now-7d", "to": "now" },
      "refresh": "30s",
      "templating": {
        "list": [
          {
            "name": "pnl",
            "label": "P&L",
            "type": "query",
            "datasource": { "type": "prometheus", "uid": "prometheus" },
            "query": "label_values(ea_conformance_ratio, pnl)",
            "includeAll": true,
            "multi": true,
            "refresh": 2
          }
        ]
      },
      "panels": [
        {
          "type": "stat",
          "title": "Cohort conformance",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 5, "w": 6, "x": 0, "y": 0 },
          "fieldConfig": { "defaults": { "unit": "percentunit", "min": 0, "max": 1,
            "thresholds": { "mode": "absolute", "steps": [
              { "color": "red", "value": null }, { "color": "yellow", "value": 0.8 },
              { "color": "green", "value": 0.95 } ] } } },
          "targets": [ { "expr": "ea_cohort_conformance_ratio", "refId": "A" } ]
        },
        {
          "type": "stat",
          "title": "Enforced violations",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 5, "w": 6, "x": 6, "y": 0 },
          "fieldConfig": { "defaults": { "thresholds": { "mode": "absolute", "steps": [
            { "color": "green", "value": null }, { "color": "red", "value": 1 } ] } } },
          "targets": [ { "expr": "sum(ea_enforced_violations)", "refId": "A" } ]
        },
        {
          "type": "stat",
          "title": "Systems reported",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 5, "w": 6, "x": 12, "y": 0 },
          "targets": [ { "expr": "ea_systems_reported", "refId": "A" } ]
        },
        {
          "type": "piechart",
          "title": "Evaluations by verdict",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 5, "w": 6, "x": 18, "y": 0 },
          "targets": [ { "expr": "sum by (verdict) (ea_fitness_evaluations{pnl=~\"$pnl\"})",
            "legendFormat": "{{verdict}}", "refId": "A" } ]
        },
        {
          "type": "bargauge",
          "title": "Conformance by system",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 5 },
          "options": { "orientation": "horizontal", "displayMode": "gradient" },
          "fieldConfig": { "defaults": { "unit": "percentunit", "min": 0, "max": 1,
            "thresholds": { "mode": "absolute", "steps": [
              { "color": "red", "value": null }, { "color": "yellow", "value": 0.8 },
              { "color": "green", "value": 0.95 } ] } } },
          "targets": [ { "expr": "ea_conformance_ratio{pnl=~\"$pnl\"}",
            "legendFormat": "{{system}}", "refId": "A" } ]
        },
        {
          "type": "timeseries",
          "title": "Conformance trend by P&L",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 5 },
          "fieldConfig": { "defaults": { "unit": "percentunit", "min": 0, "max": 1 } },
          "targets": [ { "expr": "avg by (pnl) (ea_conformance_ratio)",
            "legendFormat": "{{pnl}}", "refId": "A" } ]
        },
        {
          "type": "table",
          "title": "Active waivers (days remaining)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 7, "w": 24, "x": 0, "y": 13 },
          "targets": [ { "expr": "ea_waiver_days_remaining", "format": "table",
            "instant": true, "refId": "A" } ]
        }
      ]
    }
  ea-slo.json: |
    {
      "title": "SLO / runtime fitness",
      "uid": "ea-slo",
      "tags": ["ea", "slo", "runtime"],
      "schemaVersion": 39,
      "editable": true,
      "time": { "from": "now-3h", "to": "now" },
      "refresh": "30s",
      "panels": [
        {
          "type": "timeseries",
          "title": "HTTP latency max by service — SLO < 1s (warn 0.5)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 0 },
          "fieldConfig": { "defaults": { "unit": "s",
            "custom": { "thresholdsStyle": { "mode": "line" } },
            "thresholds": { "mode": "absolute", "steps": [
              { "color": "green", "value": null }, { "color": "yellow", "value": 0.5 },
              { "color": "red", "value": 1.0 } ] } } },
          "targets": [ { "expr": "max by (application)(http_server_requests_seconds_max)",
            "legendFormat": "{{application}}", "refId": "A" } ]
        },
        {
          "type": "timeseries",
          "title": "Outbox pending by service — SLO < 500 (warn 100)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "fieldConfig": { "defaults": {
            "custom": { "thresholdsStyle": { "mode": "line" } },
            "thresholds": { "mode": "absolute", "steps": [
              { "color": "green", "value": null }, { "color": "yellow", "value": 100 },
              { "color": "red", "value": 500 } ] } } },
          "targets": [ { "expr": "sum by (application)(msfw_outbox_pending_events)",
            "legendFormat": "{{application}}", "refId": "A" } ]
        },
        {
          "type": "stat",
          "title": "Outbox parked (poison) — SLO = 0",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "fieldConfig": { "defaults": { "thresholds": { "mode": "absolute", "steps": [
            { "color": "green", "value": null }, { "color": "red", "value": 1 } ] } } },
          "targets": [ { "expr": "sum(msfw_outbox_parked_events)", "refId": "A" } ]
        },
        {
          "type": "timeseries",
          "title": "Latency drift — now vs 1h ago (warn if now > 1.5× baseline)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 16 },
          "fieldConfig": { "defaults": { "unit": "s" } },
          "targets": [
            { "expr": "max by (application)(http_server_requests_seconds_max)",
              "legendFormat": "{{application}} now", "refId": "A" },
            { "expr": "max by (application)(http_server_requests_seconds_max offset 1h)",
              "legendFormat": "{{application}} 1h ago", "refId": "B" }
          ]
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: infra
  labels: { app: grafana }
spec:
  replicas: 1
  selector:
    matchLabels: { app: grafana }
  template:
    metadata:
      labels: { app: grafana }
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.4.0
          env:
            - { name: GF_AUTH_ANONYMOUS_ENABLED,  value: "true" }
            - { name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: "Admin" }
            - { name: GF_AUTH_BASIC_ENABLED,      value: "false" }
          ports:
            - containerPort: 3000
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 512Mi }
          readinessProbe:
            httpGet: { path: /api/health, port: 3000 }
            periodSeconds: 5
          volumeMounts:
            - { name: datasources, mountPath: /etc/grafana/provisioning/datasources }
            - { name: provider,    mountPath: /etc/grafana/provisioning/dashboards }
            - { name: dashboards,  mountPath: /var/lib/grafana/dashboards }
      volumes:
        - name: datasources
          configMap: { name: grafana-datasources }
        - name: provider
          configMap: { name: grafana-dashboard-provider }
        - name: dashboards
          configMap: { name: grafana-dashboards }
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: infra
  labels: { app: grafana }
spec:
  selector: { app: grafana }
  ports:
    - port: 3000
      targetPort: 3000
