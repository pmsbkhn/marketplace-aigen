# Checkout service — stateless saga orchestrator in the meshed `marketplace` namespace.
# No database; calls sibling services over REST by their in-cluster Service DNS.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  namespace: marketplace
  labels: { app: checkout }
spec:
  replicas: 1
  selector:
    matchLabels: { app: checkout }
  template:
    metadata:
      labels: { app: checkout }
      annotations:
        proxy.istio.io/config: '{"holdApplicationUntilProxyStarts": true}'
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /actuator/prometheus
    spec:
      initContainers:
        # Copies the OpenTelemetry Java agent from a prebuilt image into a shared volume — a `cp`,
        # no in-pod egress (Istio's init iptables would block a runtime download).
        - name: fetch-otel-agent
          image: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-java:2.10.0
          command: ["cp", "/javaagent.jar", "/otel/opentelemetry-javaagent.jar"]
          volumeMounts:
            - { name: otel-agent, mountPath: /otel }
      containers:
        - name: checkout
          image: checkout-service:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: k8s
            - { name: JAVA_TOOL_OPTIONS,           value: "-javaagent:/otel/opentelemetry-javaagent.jar" }
            - { name: OTEL_SERVICE_NAME,           value: checkout-service }
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: http://tempo.infra:4318 }
            - { name: OTEL_EXPORTER_OTLP_PROTOCOL, value: http/protobuf }
            - { name: OTEL_TRACES_EXPORTER,        value: otlp }
            - { name: OTEL_METRICS_EXPORTER,       value: none }
            - { name: OTEL_LOGS_EXPORTER,          value: none }
            - { name: OTEL_TRACES_SAMPLER,         value: parentbased_always_on }
            - { name: OTEL_PROPAGATORS,            value: "tracecontext,baggage" }
          volumeMounts:
            - { name: otel-agent, mountPath: /otel }
          resources:
            requests: { cpu: 200m, memory: 384Mi }
            limits:   { cpu: "2",  memory: 768Mi }
          startupProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            periodSeconds: 5
            failureThreshold: 40
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8080 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            periodSeconds: 15
      volumes:
        - name: otel-agent
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: checkout
  namespace: marketplace
  labels: { app: checkout }
spec:
  selector: { app: checkout }
  ports:
    - name: http
      port: 8080
      targetPort: 8080
