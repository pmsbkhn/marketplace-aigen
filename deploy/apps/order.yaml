# Order service — meshed `marketplace` namespace, real Postgres (order_db).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order
  namespace: marketplace
  labels: { app: order }
spec:
  replicas: 1
  selector:
    matchLabels: { app: order }
  template:
    metadata:
      labels: { app: order }
      annotations:
        proxy.istio.io/config: '{"holdApplicationUntilProxyStarts": true}'
    spec:
      containers:
        - name: order
          image: order-service:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: k8s
            - name: DB_HOST
              value: postgres.infra
            - name: DB_NAME
              value: order_db
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: order-db, key: username } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: order-db, key: password } }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits:   { cpu: "2",  memory: 1Gi }
          startupProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            periodSeconds: 5
            failureThreshold: 40
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8080 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            periodSeconds: 15
---
apiVersion: v1
kind: Secret
metadata:
  name: order-db
  namespace: marketplace
  labels: { app: order }
type: Opaque
stringData:
  username: marketplace
  password: marketplace
---
apiVersion: v1
kind: Service
metadata:
  name: order
  namespace: marketplace
  labels: { app: order }
spec:
  selector: { app: order }
  ports:
    - name: http
      port: 8080
      targetPort: 8080
