# Payment service — meshed `marketplace` namespace, real Postgres (payment_db).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment
  namespace: marketplace
  labels: { app: payment }
spec:
  replicas: 1
  selector:
    matchLabels: { app: payment }
  template:
    metadata:
      labels: { app: payment }
      annotations:
        proxy.istio.io/config: '{"holdApplicationUntilProxyStarts": true}'
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /actuator/prometheus
    spec:
      initContainers:
        - name: fetch-otel-agent
          image: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-java:2.10.0
          command: ["cp", "/javaagent.jar", "/otel/opentelemetry-javaagent.jar"]
          volumeMounts:
            - { name: otel-agent, mountPath: /otel }
      volumes:
        - name: otel-agent
          emptyDir: {}
      containers:
        - name: payment
          image: payment-service:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: k8s
            - { name: JAVA_TOOL_OPTIONS,           value: "-javaagent:/otel/opentelemetry-javaagent.jar" }
            - { name: OTEL_SERVICE_NAME,           value: payment-service }
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: http://tempo.infra:4318 }
            - { name: OTEL_EXPORTER_OTLP_PROTOCOL, value: http/protobuf }
            - { name: OTEL_TRACES_EXPORTER,        value: otlp }
            - { name: OTEL_METRICS_EXPORTER,       value: none }
            - { name: OTEL_LOGS_EXPORTER,          value: none }
            - { name: OTEL_TRACES_SAMPLER,         value: parentbased_always_on }
            - { name: OTEL_PROPAGATORS,            value: "tracecontext,baggage" }
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: marketplace-kafka-bootstrap.infra:9092
            - name: SPRING_KAFKA_SCHEMA_REGISTRY_URL
              value: http://schema-registry.infra:8081
            - name: DB_HOST
              value: postgres.infra
            - name: DB_NAME
              value: payment_db
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: payment-db, key: username } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: payment-db, key: password } }
          volumeMounts:
            - { name: otel-agent, mountPath: /otel }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits:   { cpu: "2",  memory: 1Gi }
          startupProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            periodSeconds: 5
            failureThreshold: 40
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8080 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            periodSeconds: 15
---
apiVersion: v1
kind: Secret
metadata:
  name: payment-db
  namespace: marketplace
  labels: { app: payment }
type: Opaque
stringData:
  username: marketplace
  password: marketplace
---
apiVersion: v1
kind: Service
metadata:
  name: payment
  namespace: marketplace
  labels: { app: payment }
spec:
  selector: { app: payment }
  ports:
    - name: http
      port: 8080
      targetPort: 8080
