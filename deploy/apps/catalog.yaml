# Catalog service — deployed to the meshed `marketplace` namespace.
# Image is built on the host and `k3d image import`-ed, so imagePullPolicy=IfNotPresent.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: marketplace
  labels: { app: catalog }
spec:
  replicas: 1
  selector:
    matchLabels: { app: catalog }
  template:
    metadata:
      labels: { app: catalog }
      annotations:
        # Wait for the Istio sidecar before starting the app, so the JDBC connection to
        # postgres.infra succeeds on the first try (avoids the proxy-not-ready startup race).
        proxy.istio.io/config: '{"holdApplicationUntilProxyStarts": true}'
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /actuator/prometheus
    spec:
      containers:
        - name: catalog
          image: catalog-service:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: k8s
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: marketplace-kafka-bootstrap.infra:9092
            - name: SPRING_KAFKA_SCHEMA_REGISTRY_URL
              value: http://schema-registry.infra:8081
            - name: DB_HOST
              value: postgres.infra
            - name: DB_NAME
              value: catalog_db
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: catalog-db, key: username } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: catalog-db, key: password } }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits:   { cpu: "2",  memory: 1Gi }
          startupProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            periodSeconds: 5
            failureThreshold: 40   # up to ~200s for first boot (JVM + JPA schema)
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8080 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            periodSeconds: 15
---
apiVersion: v1
kind: Secret
metadata:
  name: catalog-db
  namespace: marketplace
  labels: { app: catalog }
type: Opaque
stringData:
  username: marketplace
  password: marketplace
---
apiVersion: v1
kind: Service
metadata:
  name: catalog
  namespace: marketplace
  labels: { app: catalog }
spec:
  selector: { app: catalog }
  ports:
    - name: http
      port: 8080
      targetPort: 8080
